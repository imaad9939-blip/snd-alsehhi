<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سند الصحي</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="container">
      <div class="card">
        <p class="eyebrow">Sanad Health</p>
        <h1>مرحباً بك في سند الصحي</h1>
        <p class="message">
          تم إعداد الخادم بشكل صحيح، لكن هذا الموقع يحتاج إلى واجهة ثابتة للمستخدم.
        </p>
        <button id="healthBtn" type="button">فحص الحالة</button>
        <pre id="result">جارٍ التحقق...</pre>
      </div>
    </main>

    <dialog id="loginDialog" aria-labelledby="loginTitle">
      <button id="dialogClose" type="button" aria-label="إغلاق">×</button>
      <h2 id="loginTitle">تسجيل الدخول</h2>
      <form id="loginForm">
        <label for="username">اسم المستخدم</label>
        <input id="username" name="username" type="text" autocomplete="username" required />

        <label for="password">كلمة المرور</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />

        <p id="formMessage" role="status" aria-live="polite"></p>
        <button id="submitLogin" type="submit">تسجيل الدخول</button>
      </form>
    </dialog>

    <script src="/app.js"></script>
  </body>
</html>
